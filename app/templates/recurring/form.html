{% extends "base.html" %}

{% block title %}{{ action }} Recurring Expense{% endblock %}
{% block page_title %}{{ action }} Recurring{% endblock %}

{% block content %}
<div style="max-width:560px;margin:0 auto;">
    <div class="card">
        <div class="card-header">
            <h3 style="font-size:1rem;margin:0;">🔄 {{ action }} Recurring Expense</h3>
            <a href="{{ url_for('recurring.index') }}" class="btn btn-ghost btn-sm">Cancel</a>
        </div>
        <div class="card-body">
            <form
                action="{{ url_for('recurring.edit', recurring_id=recurring.id) if recurring else url_for('recurring.new') }}"
                method="post" novalidate>
                <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">

                <div class="form-group">
                    <label class="form-label" for="description">
                        Description <span class="required">*</span>
                    </label>
                    <input type="text" id="description" name="description" class="form-control"
                           value="{{ form_data.get('description', '') }}"
                           placeholder="e.g. Netflix, Rent, Gym" required maxlength="200" autofocus>
                </div>

                <div class="form-group">
                    <label class="form-label" for="amount">
                        Amount <span class="required">*</span>
                    </label>
                    <div class="input-group">
                        <span class="input-prefix">{{ current_user.currency_symbol }}</span>
                        <input type="number" id="amount" name="amount" class="form-control"
                               value="{{ form_data.get('amount', '') }}"
                               step="0.01" min="0.01" placeholder="0.00" required>
                    </div>
                </div>

                <div class="form-group">
                    <label class="form-label" for="category_id">Category <span class="required">*</span></label>
                    <select id="category_id" name="category_id" class="form-control" required>
                        <option value="">Select a category</option>
                        {% for cat in categories %}
                        <option value="{{ cat.id }}"
                            {% if form_data.get('category_id')|string == cat.id|string %}selected{% endif %}>
                            {{ cat.icon }} {{ cat.name }}
                        </option>
                        {% endfor %}
                    </select>
                </div>

                <div class="form-group">
                    <label class="form-label" for="frequency">Frequency</label>
                    <select id="frequency" name="frequency" class="form-control">
                        {% for freq in frequencies %}
                        <option value="{{ freq }}"
                            {% if form_data.get('frequency', 'Monthly') == freq %}selected{% endif %}>
                            {{ freq }}
                        </option>
                        {% endfor %}
                    </select>
                </div>

                <div class="form-group">
                    <label class="form-label" for="next_due_date">Next Due Date <span class="required">*</span></label>
                    <input type="date" id="next_due_date" name="next_due_date" class="form-control"
                           value="{{ form_data.get('next_due_date', '') }}" required>
                </div>

                <div class="form-group">
                    <label class="form-label" for="payment_method">Payment Method</label>
                    <select id="payment_method" name="payment_method" class="form-control">
                        {% for method in payment_methods %}
                        <option value="{{ method }}"
                            {% if form_data.get('payment_method', 'Other') == method %}selected{% endif %}>
                            {{ method }}
                        </option>
                        {% endfor %}
                    </select>
                </div>

                <div class="flex gap-3" style="margin-top:1.5rem;">
                    <button type="submit" class="btn btn-primary btn-lg" style="flex:1;">
                        {{ '💾 Save Changes' if action == 'Edit' else '✅ Add Recurring' }}
                    </button>
                    <a href="{{ url_for('recurring.index') }}" class="btn btn-secondary btn-lg">Cancel</a>
                </div>
            </form>
        </div>
    </div>
</div>
{% endblock %}
