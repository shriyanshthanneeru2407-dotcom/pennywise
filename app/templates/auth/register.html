{% extends "base.html" %}

{% block title %}Create Account{% endblock %}

{% block content %}
<div class="auth-layout">
    <div class="auth-card">
        <!-- Brand -->
        <div class="auth-brand">
            <div style="font-size:2rem;margin-bottom:0.5rem;">💰</div>
            <div class="brand-name">SpendWise</div>
            <div class="brand-tagline">Create your free account</div>
        </div>

        <!-- Registration form -->
        <form action="{{ url_for('auth.register') }}" method="post" novalidate>
            <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">

            <div class="form-group">
                <label class="form-label" for="name">
                    Full Name <span class="required" aria-label="required">*</span>
                </label>
                <input
                    type="text"
                    id="name"
                    name="name"
                    class="form-control"
                    value="{{ name }}"
                    placeholder="Your name"
                    required
                    autocomplete="name"
                    autofocus
                    maxlength="100"
                >
            </div>

            <div class="form-group">
                <label class="form-label" for="email">
                    Email Address <span class="required" aria-label="required">*</span>
                </label>
                <input
                    type="email"
                    id="email"
                    name="email"
                    class="form-control"
                    value="{{ email }}"
                    placeholder="you@example.com"
                    required
                    autocomplete="email"
                    maxlength="254"
                >
            </div>

            <div class="form-group">
                <label class="form-label" for="password">
                    Password <span class="required" aria-label="required">*</span>
                </label>
                <input
                    type="password"
                    id="password"
                    name="password"
                    class="form-control"
                    placeholder="At least 8 characters"
                    required
                    autocomplete="new-password"
                    minlength="8"
                >
                <div class="form-hint">Minimum 8 characters.</div>
            </div>

            <div class="form-group">
                <label class="form-label" for="confirm_password">
                    Confirm Password <span class="required" aria-label="required">*</span>
                </label>
                <input
                    type="password"
                    id="confirm_password"
                    name="confirm_password"
                    class="form-control"
                    placeholder="Repeat your password"
                    required
                    autocomplete="new-password"
                >
            </div>

            <div class="form-group">
                <label class="form-label" for="currency">
                    Preferred Currency
                </label>
                <select id="currency" name="currency" class="form-control">
                    <option value="INR" {% if currency == 'INR' or not currency %}selected{% endif %}>INR — Indian Rupee (₹)</option>
                    <option value="USD" {% if currency == 'USD' %}selected{% endif %}>USD — US Dollar ($)</option>
                    <option value="EUR" {% if currency == 'EUR' %}selected{% endif %}>EUR — Euro (€)</option>
                    <option value="GBP" {% if currency == 'GBP' %}selected{% endif %}>GBP — British Pound (£)</option>
                    <option value="CAD" {% if currency == 'CAD' %}selected{% endif %}>CAD — Canadian Dollar (CA$)</option>
                    <option value="AUD" {% if currency == 'AUD' %}selected{% endif %}>AUD — Australian Dollar (A$)</option>
                    <option value="JPY" {% if currency == 'JPY' %}selected{% endif %}>JPY — Japanese Yen (¥)</option>
                </select>
                <div class="form-hint">You can change this anytime later in Settings.</div>
            </div>

            <button type="submit" class="btn btn-primary btn-block btn-lg" style="margin-top:0.5rem;">
                Create Account
            </button>
        </form>

        <!-- Link to login -->
        <div style="text-align:center;margin-top:1.5rem;font-size:0.9rem;color:var(--text-muted);">
            Already have an account?
            <a href="{{ url_for('auth.login') }}" style="font-weight:500;">Sign in</a>
        </div>
    </div>
</div>

<script>
// Client-side validation (server-side also validates — this is just UX)
document.querySelector("form").addEventListener("submit", function (e) {
    const password = document.getElementById("password").value;
    const confirm  = document.getElementById("confirm_password").value;
    if (password.length < 8) {
        e.preventDefault();
        alert("Password must be at least 8 characters.");
        return;
    }
    if (password !== confirm) {
        e.preventDefault();
        alert("Passwords do not match.");
        return;
    }
});
</script>
{% endblock %}
