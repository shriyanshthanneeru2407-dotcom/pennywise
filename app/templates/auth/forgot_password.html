{% extends "base.html" %}

{% block title %}Reset Password — PennyWise{% endblock %}

{% block auth_content %}
<div class="auth-card">
    <div class="auth-header">
        <a href="{{ url_for('main.index') }}" class="brand-logo" style="justify-content:center;margin-bottom:1rem;">
            <img src="{{ url_for('static', filename='images/logo.jpg') }}" alt="PennyWise" class="brand-logo-img logo-continuous-glow" style="width:36px;height:36px;">
            <span class="brand-name">PennyWise</span>
        </a>
        <h2 class="auth-title">Forgot your password?</h2>
        <p class="auth-subtitle">Enter your registered email address and we'll send you a recovery link.</p>
    </div>

    <div class="auth-body">
        <form action="{{ url_for('auth.forgot_password') }}" method="post" novalidate>
            <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">

            <div class="form-group">
                <label class="form-label" for="email">Email Address</label>
                <input
                    type="email"
                    id="email"
                    name="email"
                    class="form-control"
                    placeholder="you@example.com"
                    required
                    autofocus
                >
            </div>

            <button type="submit" class="btn btn-primary btn-block btn-lg">
                Send Reset Link
            </button>
        </form>

        <div style="text-align:center;margin-top:1.5rem;font-size:0.9rem;color:var(--text-muted);">
            Remember your password?
            <a href="{{ url_for('auth.login') }}" style="font-weight:500;">Back to sign in</a>
        </div>
    </div>
</div>
{% endblock %}
