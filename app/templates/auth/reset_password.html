{% extends "base.html" %}

{% block title %}Set New Password — PennyWise{% endblock %}

{% block auth_content %}
<div class="auth-card">
    <div class="auth-header">
        <a href="{{ url_for('main.index') }}" class="brand-logo" style="justify-content:center;margin-bottom:1rem;">
            <img src="{{ url_for('static', filename='images/logo.jpg') }}" alt="PennyWise" class="brand-logo-img logo-continuous-glow" style="width:36px;height:36px;">
            <span class="brand-name">PennyWise</span>
        </a>
        <h2 class="auth-title">Choose a new password</h2>
        <p class="auth-subtitle">Make sure it's at least 8 characters long for strong account security.</p>
    </div>

    <div class="auth-body">
        <form action="{{ url_for('auth.reset_password', token=token) }}" method="post" novalidate>
            <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">

            <div class="form-group">
                <label class="form-label" for="password">New Password</label>
                <input
                    type="password"
                    id="password"
                    name="password"
                    class="form-control"
                    placeholder="At least 8 characters"
                    minlength="8"
                    required
                    autofocus
                >
            </div>

            <div class="form-group">
                <label class="form-label" for="confirm_password">Confirm New Password</label>
                <input
                    type="password"
                    id="confirm_password"
                    name="confirm_password"
                    class="form-control"
                    placeholder="Repeat password"
                    minlength="8"
                    required
                >
            </div>

            <button type="submit" class="btn btn-primary btn-block btn-lg">
                Update Password & Sign In
            </button>
        </form>
    </div>
</div>
{% endblock %}
