{% extends "base.html" %}
{% block title %}Page Not Found{% endblock %}
{% block page_title %}Not Found{% endblock %}
{% block content %}
<div class="empty-state" style="padding:5rem 2rem;">
    <div class="empty-icon" style="font-size:4rem;">🔍</div>
    <h3 style="font-size:1.5rem;">Page not found</h3>
    <p>The page you're looking for doesn't exist or has been moved.</p>
    <a href="{{ url_for('dashboard.index') if current_user.is_authenticated else url_for('main.index') }}" class="btn btn-primary">
        ← Go Home
    </a>
</div>
{% endblock %}
