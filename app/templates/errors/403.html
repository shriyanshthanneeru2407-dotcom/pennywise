{% extends "base.html" %}
{% block title %}Access Denied{% endblock %}
{% block page_title %}Access Denied{% endblock %}
{% block content %}
<div class="empty-state" style="padding:5rem 2rem;">
    <div class="empty-icon" style="font-size:4rem;">🚫</div>
    <h3 style="font-size:1.5rem;">Access Denied</h3>
    <p>You don't have permission to access this resource.</p>
    <a href="{{ url_for('dashboard.index') if current_user.is_authenticated else url_for('main.index') }}" class="btn btn-primary">← Go Home</a>
</div>
{% endblock %}
