{% extends "base.html" %}
{% block title %}Server Error{% endblock %}
{% block page_title %}Server Error{% endblock %}
{% block content %}
<div class="empty-state" style="padding:5rem 2rem;">
    <div class="empty-icon" style="font-size:4rem;">⚠️</div>
    <h3 style="font-size:1.5rem;">Something went wrong</h3>
    <p>An unexpected error occurred. Please try again. If the problem persists, contact support.</p>
    <a href="{{ url_for('dashboard.index') if current_user.is_authenticated else url_for('main.index') }}" class="btn btn-primary">← Go Home</a>
</div>
{% endblock %}
