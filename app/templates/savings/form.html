{% extends "base.html" %}

{% block title %}{{ action }} Savings Goal{% endblock %}
{% block page_title %}{{ action }} Savings Goal{% endblock %}

{% block content %}
<div style="max-width:540px;margin:0 auto;">
    <div class="card">
        <div class="card-header">
            <h3 style="font-size:1rem;margin:0;">🎯 {{ action }} Savings Goal</h3>
            <a href="{{ url_for('savings.index') }}" class="btn btn-ghost btn-sm">Cancel</a>
        </div>
        <div class="card-body">
            <form action="{{ url_for('savings.new') }}" method="post" novalidate>
                <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">

                <div class="form-group">
                    <label class="form-label" for="title">Goal Title <span class="required">*</span></label>
                    <input type="text" id="title" name="title" class="form-control" placeholder="e.g. Emergency Fund, New Laptop, Japan Trip" required autofocus>
                </div>

                <div class="form-group">
                    <label class="form-label" for="target_amount">Target Amount <span class="required">*</span></label>
                    <div class="input-group">
                        <span class="input-prefix">{{ current_user.currency_symbol }}</span>
                        <input type="number" id="target_amount" name="target_amount" class="form-control" placeholder="50000" step="0.01" min="0.01" required>
                    </div>
                </div>

                <div class="form-group">
                    <label class="form-label" for="initial_amount">Initial Deposit <span class="text-muted text-sm">(optional)</span></label>
                    <div class="input-group">
                        <span class="input-prefix">{{ current_user.currency_symbol }}</span>
                        <input type="number" id="initial_amount" name="initial_amount" class="form-control" placeholder="0" step="0.01" min="0">
                    </div>
                </div>

                <div class="grid-2">
                    <div class="form-group">
                        <label class="form-label" for="category">Category</label>
                        <select id="category" name="category" class="form-control">
                            <option value="Emergency Fund">🛡️ Emergency Fund</option>
                            <option value="Vacation">✈️ Vacation</option>
                            <option value="Electronics">💻 Electronics</option>
                            <option value="Vehicle">🚗 Vehicle</option>
                            <option value="Home & Living">🏠 Home & Living</option>
                            <option value="Investment">📈 Investment</option>
                            <option value="General" selected>🎯 General</option>
                        </select>
                    </div>

                    <div class="form-group">
                        <label class="form-label" for="target_date">Target Date <span class="text-muted text-sm">(optional)</span></label>
                        <input type="date" id="target_date" name="target_date" class="form-control">
                    </div>
                </div>

                <div class="flex gap-3" style="margin-top:1.5rem;">
                    <button type="submit" class="btn btn-primary btn-lg" style="flex:1;">
                        💾 Save Goal
                    </button>
                    <a href="{{ url_for('savings.index') }}" class="btn btn-secondary btn-lg">
                        Cancel
                    </a>
                </div>
            </form>
        </div>
    </div>
</div>
{% endblock %}
